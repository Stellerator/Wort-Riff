    else if (r === 2) {
      s.step--;
      if (s.step <= 0) fertigGraduiert(relearn ? s.iv : SRS.gradGut, 2);
      else info.gap = 6;
    } else fertigGraduiert(relearn ? Math.max(2, s.iv) : SRS.gradLeicht, relearn ? 2 : 3);
    if (s.step === 0) s.relearn = false;
    if (s.step > 0) s.due = dn;
    return { s, info };
  }
  // fertig gelernte Karte
  if (!faellig && r >= 1) { info.aenderung = false; return { s, info }; }   // freies Üben ändert den Plan nicht
  const spaet = Math.max(0, dn - s.due), iv = Math.max(1, s.iv || 1);
  if (r === 0) {                                                   // Fehler: zurück in die Lernphase
    s.lapses++; s.ease = Math.max(SRS.easeMin, s.ease - 0.2);
    s.iv = Math.max(1, Math.floor(iv * SRS.lapseFak)); s.b = 1; s.step = 1; s.relearn = true; s.due = dn;
    info.lapse = true; info.gap = 3;
    return { s, info };
  }
  let ivN;
  if (r === 1) { ivN = Math.max(iv + 1, Math.round((iv + spaet / 4) * SRS.hart)); s.ease = Math.max(SRS.easeMin, s.ease - 0.15); }
  else if (r === 2) { ivN = Math.max(iv + 1, Math.round((iv + spaet / 2) * s.ease)); s.b = Math.min(5, s.b + 1); }
  else { ivN = Math.max(iv + 1, Math.round((iv + spaet) * s.ease * SRS.leicht)); s.ease = Math.min(SRS.easeMax, s.ease + 0.15); s.b = Math.min(5, s.b + 1); }
  if (fuzz && ivN >= 7) ivN = Math.max(iv + 1, Math.round(ivN * (0.95 + rand() * 0.1)));
  s.iv = Math.max(1, Math.min(ivN, cap, SRS.maxIv)); s.due = dn + s.iv;
  return { s, info };
}
// Eine Antwort verbuchen. Gibt zurück, ob die Karte jetzt für heute „erledigt“ ist (nicht mehr fällig).
function bewerte(u, cid, r) {
  const d = heute(), dn = tagNr(d);
  const alt = u.cards[cid];
  const { s, info } = srsSchritt(alt, r, dn, capFuer(u, cid, dn), true);
  const war = alt ? alt.b : 0;
  s.n++; if (r >= 2) s.ok++;
  s.last = Date.now();
  u.cards[cid] = s;
  const t = u.tage[d] || (u.tage[d] = { n: 0, ok: 0 });
  t.n++; if (r >= 2) t.ok++;
  if (alt && alt.step === 0 && alt.b >= 2 && alt.due <= dn) { t.rev = (t.rev || 0) + 1; if (r >= 2) t.revOk = (t.revOk || 0) + 1; }   // für die Behaltensquote
  u.stats.antworten++; if (r >= 2) u.stats.richtig++;
  const erledigt = s.step === 0 && s.due > dn;
  return { neu: !alt, war, jetzt: s.b, erledigt, graduiert: info.graduiert, erstGrad: info.graduiert && !(alt && alt.relearn), wiederholt: !!(alt && alt.step === 0 && alt.due <= dn && r >= 2), lapse: info.lapse, gap: info.gap, aufgestiegen: s.b > war && s.step === 0 };
}
// Vorschau der Abstände für die vier Antwort-Knöpfe (wie bei Anki)
function ivText(tage) {
  if (tage < 1) return 'gleich';
  if (tage < 30) return tage === 1 ? '1 Tag' : tage + ' Tage';
  if (tage < 365) { const m = Math.round(tage / 30.4); return m === 1 ? '1 Monat' : m + ' Monate'; }
  return '1 Jahr';
}
function vorschau(u, cid) {
  const dn = tagNr(heute()), cap = capFuer(u, cid, dn);
  return [0, 1, 2, 3].map(r => {
    const { s, info } = srsSchritt(u.cards[cid], r, dn, cap, false);
    if (!info.aenderung) return ivText(s.iv);
    return s.step > 0 ? 'gleich' : ivText(s.iv);
  });
}

// ---------- Fortschritt ----------
function stand(u, P) {                                             // { n, ok, pct, boxen, gesehen }
  const cids = projektKarten(P);
  const boxen = [0, 0, 0, 0, 0, 0];
  let ok = 0;
  cids.forEach(c => { const s = u.cards[c]; boxen[s ? s.b : 0]++; if (erreicht(s, P.ziel)) ok++; });
  return { n: cids.length, ok, pct: cids.length ? ok / cids.length : 0, boxen, gesehen: cids.length - boxen[0] };
}
function standKarten(u, cids, ziel) {                              // Anteil der Karten, die mindestens Box „ziel“ erreicht haben
  let ok = 0; cids.forEach(c => { if (erreicht(u.cards[c], ziel)) ok++; });
  return { n: cids.length, ok, pct: cids.length ? ok / cids.length : 0 };
}
// Kartenreife wie bei Anki: neu / lernt / jung (< 21 Tage) / reif (≥ 21 Tage)
function reifeVerteilung(u, cids) {
  const o = { neu: 0, lernt: 0, jung: 0, reif: 0 };
  cids.forEach(c => { const s = u.cards[c]; if (!s) o.neu++; else if (s.step > 0) o.lernt++; else if (s.iv >= SRS.langIv) o.reif++; else o.jung++; });
  return o;
}
function vorhersage(u, cids, tage) {                               // fällige Karten je Tag (Index 0 = heute inkl. Überfälliges)
  const dn = tagNr(heute()), out = new Array(tage).fill(0);
  cids.forEach(c => { const s = u.cards[c]; if (!s) return; const i = Math.max(0, s.due - dn); if (i < tage) out[i]++; });
  return out;
}
function behaltensquote(u, tage = 30) {
  let n = 0, ok = 0;
  for (let i = 0; i < tage; i++) { const t = u.tage[addTage(heute(), -i)]; if (t && t.rev) { n += t.rev; ok += t.revOk || 0; } }
  return n >= 10 ? ok / n : null;
}
// Ehrlichkeit: reicht die Zeit überhaupt? (Box 3 braucht mind. 2 Lerntage, Box 4 mind. 5 Tage Abstand zwischen Start und Ende)
function realismus(P, nKarten) {
  if (P.dauer || !P.end) return null;
  const tage = diffTage(heute(), P.end);
  const minT = P.ziel >= 4 ? 4 : P.ziel >= 3 ? 1 : 0, empf = P.ziel >= 4 ? 7 : P.ziel >= 3 ? 3 : 1;
  const lt = lernTageRest(P, heute());
  const z = ziel_(P.ziel).name;
  if (tage < minT) return { stufe: 'eng', txt: `Für „${z}“ braucht es mindestens ${minT + 1} Tage. Wähle mehr Zeit oder ein kleineres Ziel.` };
  const proTag = nKarten / Math.max(1, lt - reserveTage(P.ziel));
  if (proTag > 22) return { stufe: 'viel', txt: `Das sind etwa ${Math.ceil(proTag)} neue Karten pro Tag – ziemlich viel. Mehr Zeit oder weniger Lektionen machen es entspannter.` };
  if (tage < empf) return { stufe: 'knapp', txt: `Das geht, ist aber knapp: Für „${z}“ sind ${empf} Tage oder mehr entspannter, falls mal ein Tag ausfällt.` };
  const nn = Math.max(1, Math.ceil(proTag));
  return { stufe: 'ok', txt: `Etwa ${nn} neue ${nn === 1 ? 'Karte' : 'Karten'} pro Lerntag – das ist gut machbar.` };
}

// ---------- Tagesplan ----------
function heutePlan(u, P) {
  const d = heute();
  if (P.heute && P.heute.d === d) return P.heute;
  const dn = tagNr(d), cids = projektKarten(P);
  // fällig: Lernphase zuerst, dann nach „relativer Überfälligkeit“ (wie Anki)
  const faellig = cids.filter(c => u.cards[c] && u.cards[c].due <= dn)
    .sort((a, b) => {
      const A = u.cards[a], B = u.cards[b];
      if ((A.step > 0) !== (B.step > 0)) return A.step > 0 ? -1 : 1;
      return ((dn - B.due) / Math.max(1, B.iv)) - ((dn - A.due) / Math.max(1, A.iv));
    });
  const unseen = cids.filter(c => !u.cards[c]);
  const cap = (TEMPO[u.set.tempo] || TEMPO.normal).max;
  let quota = 0;
  if (unseen.length) {
    if (P.end) quota = Math.ceil(unseen.length / Math.max(1, lernTageRest(P, d) - reserveTage(P.ziel)));
    else quota = Math.min(5, unseen.length);
    quota = clamp(quota, 1, 20);
  }
  const frei = !lerntag(P, d);
  let nf = Math.min(faellig.length, cap), nn = Math.min(quota, Math.max(0, cap - nf));
  if (nn < Math.min(quota, 3)) { nn = Math.min(quota, 3); nf = Math.min(faellig.length, cap - nn); }
  if (frei) { nf = 0; nn = 0; }                                    // Ruhetag: nur freiwillig
  P.heute = { d, ziel: nf + nn, faellig: faellig.slice(0, nf), neu: unseen.slice(0, nn), erledigt: {}, fertig: false, ruhetag: frei };
  sichere();
  return P.heute;
}
const planGeschafft = pl => Object.keys(pl.erledigt).length;

// Runde zusammenstellen: erst fällig/neu aus dem Tagesplan, danach „Bonusrunde“ (freies Üben, ändert den Plan nicht)
function baueRunde(u, P) {
  const n = u.set.runde || 10;
  const pl = heutePlan(u, P);
  const offen = pl.faellig.concat(pl.neu).filter(c => !pl.erledigt[c]);
  if (offen.length) return { karten: shuffle(offen.slice(0, n)), bonus: false };
  const alle = projektKarten(P);
  const gesehen = alle.filter(c => u.cards[c]).sort((a, b) => (u.cards[a].b - u.cards[b].b) || (u.cards[a].last - u.cards[b].last));
  let pool = gesehen.slice(0, n * 2);
  if (pool.length < n) pool = pool.concat(alle.filter(c => !u.cards[c]).slice(0, n - pool.length));
  return { karten: shuffle(pool).slice(0, n), bonus: true };
}

// In allen aktiven Projekten dieser Sprache, die die Karte im heutigen Plan haben, als erledigt markieren
function planAbhaken(u, cid) {
  const hit = [];
  const sp = cidInfo(cid).sp;
  projekte(u, sp).filter(istAktiv).forEach(P => {
    const pl = heutePlan(u, P);
    if (!pl.erledigt[cid] && (pl.faellig.indexOf(cid) >= 0 || pl.neu.indexOf(cid) >= 0)) {
      pl.erledigt[cid] = 1;
      if (!pl.fertig && planGeschafft(pl) >= pl.ziel && pl.ziel > 0) { pl.fertig = true; hit.push(P); }
    }
  });
  return hit;                                                      // Projekte, deren Tagesziel jetzt erreicht ist
}

// ---------- Serie („Strömung“): zählt nur innerhalb eines Projekts, ohne Strafe ----------
function verpassteTage(P, last, d) {                                // Lerntage zwischen last und d (beide exklusive)
  let n = 0; for (let x = addTage(last, 1); x < d; x = addTage(x, 1)) if (lerntag(P, x)) n++;
  return n;
}
function jokerFrei(P, d) { return !P.serie.joker || diffTage(P.serie.joker, d) >= 7; }
function serieLebt(P, d) {
  const s = P.serie; if (!s.last) return false;
  if (s.last === d) return true;
  const v = verpassteTage(P, s.last, d);
  return v === 0 || (v === 1 && jokerFrei(P, d));
}
const serieJetzt = P => (P.serie.last && serieLebt(P, heute()) ? P.serie.cur : 0);
function serieFortsetzen(P) {                                       // beim Erreichen des Tagesziels
  const s = P.serie, d = heute();
  if (s.last === d) return { cur: s.cur, joker: false };
  let joker = false;
  if (s.last && serieLebt(P, d)) {
    if (verpassteTage(P, s.last, d) === 1) { s.joker = d; joker = true; }
    s.cur++;
  } else s.cur = 1;
  s.last = d; s.best = Math.max(s.best, s.cur);
  return { cur: s.cur, joker };
}

// Wochenziel (Dauerprojekt): an 3 verschiedenen Tagen das Tagesziel schaffen
function wochenZaehlen(P) {
  const w = wochenStart(heute());
  const W = P.wochen[w] || (P.wochen[w] = { tage: [], muschel: false });
  if (W.tage.indexOf(heute()) < 0) W.tage.push(heute());
  return W;
}

  // ---------- Zubehör ----------
  const acc = {
    krone: h => { const s = h.r / 56; return `<g transform="translate(${h.x} ${h.top + 10 * s}) scale(${s})"><path d="M-27 2 L-31 -26 L-14 -12 L0 -34 L14 -12 L31 -26 L27 2Z" fill="#FFC83D"/><rect x="-27" y="-1" width="54" height="10" rx="3" fill="#FFD866"/><circle cx="0" cy="-28" r="3.4" fill="#E5484D" stroke-width="2.5"/><circle cx="-28" cy="-22" r="3" fill="#6A4FC8" stroke-width="2.5"/><circle cx="28" cy="-22" r="3" fill="#2FB38A" stroke-width="2.5"/></g>`; },
    piraten: h => { const s = h.r / 56; return `<g transform="translate(${h.x} ${h.top + 14 * s}) scale(${s})"><path d="M-46 2 C-44 -26 -22 -42 0 -42 C22 -42 44 -26 46 2 C22 10 -22 10 -46 2Z" fill="#1B2433"/><path d="M-44 2 C-20 8 20 8 44 2" fill="none" stroke="#E5484D" stroke-width="5"/><circle cx="0" cy="-20" r="7.5" fill="#fff" stroke-width="2.5"/><path d="M-12 -8 L12 -30 M12 -8 L-12 -30" stroke="#fff" stroke-width="4"/><circle cx="-2.6" cy="-21" r="1.6" fill="${INK}" stroke="none"/><circle cx="2.6" cy="-21" r="1.6" fill="${INK}" stroke="none"/></g>`; },
    zylinder: h => { const s = h.r / 56; return `<g transform="translate(${h.x} ${h.top + 10 * s}) scale(${s})"><rect x="-23" y="-50" width="46" height="46" rx="5" fill="#1B2433"/><rect x="-23" y="-18" width="46" height="9" fill="#E5484D" stroke-width="3"/><ellipse cx="0" cy="-2" rx="38" ry="9" fill="#1B2433"/></g>`; },
    maske: h => { const s = h.r / 56; return `<g transform="translate(${h.x} ${h.top + 18 * s}) scale(${s})"><path d="M-36 6 L-58 14 M36 6 L58 14" fill="none" stroke="#FF7A59" stroke-width="7"/><rect x="-36" y="-12" width="72" height="34" rx="14" fill="#BDF0F7" stroke-width="5"/><rect x="-36" y="-12" width="72" height="34" rx="14" fill="none" stroke="#FF7A59" stroke-width="3"/><path d="M-22 -2 C-12 -8 -4 -8 2 -4" fill="none" stroke="#fff" stroke-width="4"/></g>`; },
    schleife: h => { const s = h.r / 56; return `<g transform="translate(${h.x + 30 * s} ${h.top + 12 * s}) rotate(14) scale(${s})"><path d="M0 0 L-26 -16 L-26 16Z" fill="#FF7FA8"/><path d="M0 0 L26 -16 L26 16Z" fill="#FF7FA8"/><circle cx="0" cy="0" r="7" fill="#FF4F8B" stroke-width="3.5"/></g>`; },
    kopfhoerer: h => { const s = h.r / 56; const y = h.ey; return `${T(`M${h.x - h.sx} ${y - 4} C${h.x - h.sx} ${h.top - 26 * s} ${h.x + h.sx} ${h.top - 26 * s} ${h.x + h.sx} ${y - 4}`, 7, '#FFC83D')}<rect x="${h.x - h.sx - 11}" y="${y - 16}" width="19" height="34" rx="9" fill="#FF7A59"/><rect x="${h.x + h.sx - 8}" y="${y - 16}" width="19" height="34" rx="9" fill="#FF7A59"/>`; },
    brille: h => { const s = h.r / 56, r = 15 * s; return `<g fill="#BDF0F7" fill-opacity=".45" stroke-width="4.5"><circle cx="${h.x - h.ex}" cy="${h.ey}" r="${r}"/><circle cx="${h.x + h.ex}" cy="${h.ey}" r="${r}"/></g><path d="M${h.x - h.ex + r} ${h.ey} H${h.x + h.ex - r} M${h.x - h.ex - r} ${h.ey - 2} L${h.x - h.ex - r - 12} ${h.ey - 6} M${h.x + h.ex + r} ${h.ey - 2} L${h.x + h.ex + r + 12} ${h.ey - 6}" fill="none" stroke-width="4"/>`; },
    schal: h => { const s = h.r / 56, y = h.chin - 12 * s, w = h.cw; return `<path d="M${h.x - w} ${y} Q${h.x} ${y + 22 * s} ${h.x + w} ${y} L${h.x + w - 2} ${y + 16 * s} Q${h.x} ${y + 38 * s} ${h.x - w + 2} ${y + 16 * s}Z" fill="#E5484D"/><path d="M${h.x + w - 22 * s} ${y + 14 * s} L${h.x + w - 12 * s} ${y + 38 * s} L${h.x + w + 8 * s} ${y + 34 * s} L${h.x + w + 2 * s} ${y + 10 * s}Z" fill="#E5484D"/><path d="M${h.x - w * 0.5} ${y + 12 * s} l5 18 M${h.x} ${y + 17 * s} l0 18 M${h.x + w * 0.5} ${y + 12 * s} l-5 18" stroke="#fff" stroke-width="4" fill="none"/>`; },
    kette: h => { const s = h.r / 56, y = h.chin - 10 * s; let o = ''; for (let i = 0; i < 9; i++) { const t = (i - 4) / 4; o += `<circle cx="${(h.x + t * h.cw).toFixed(1)}" cy="${(y + t * t * 16 * s).toFixed(1)}" r="${(5.2 * s).toFixed(1)}" fill="#fff" stroke-width="3"/>`; } return o + `<path d="M${h.x - 8 * s} ${y + 18 * s} L${h.x + 8 * s} ${y + 18 * s} L${h.x} ${y + 34 * s}Z" fill="#FFC83D" stroke-width="3.5"/>`; },
    stern: h => { const s = h.r / 56; return `<path d="${star(h.x, h.top + 24 * s, 14 * s, 6 * s, 5)}" fill="#FFC83D" stroke-width="3.4"/>`; },
    blume: h => { const s = h.r / 56, cx = h.x - 32 * s, cy = h.top + 16 * s; let o = ''; for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; o += `<circle cx="${(cx + Math.cos(a) * 8 * s).toFixed(1)}" cy="${(cy + Math.sin(a) * 8 * s).toFixed(1)}" r="${(7 * s).toFixed(1)}" fill="#FF9DC2" stroke-width="3"/>`; } return o + `<circle cx="${cx}" cy="${cy}" r="${5 * s}" fill="#FFD866" stroke-width="3"/>`; },
    perle: h => { const s = h.r / 56; return `<circle cx="${h.x}" cy="${h.top + 12 * s}" r="${11 * s}" fill="#FFF7EC" stroke-width="4"/><path d="M${h.x - 5 * s} ${h.top + 8 * s} a6 6 0 0 1 6 -4" fill="none" stroke="#fff" stroke-width="3.2"/>`; }

  const ZUBEHOER = Object.keys(acc);

  // ---------- Entwicklung: Stufe 2 (Stern 3) und Stufe 3 (Stern 5) ----------
  // Stufe 1 ist der kleine Rundling (nur Kopf). Jede Art hat in ART.evo[art] = { 2: p => ({ hd, svg, rot? }), 3: … } eigene Körper für Stufe 2 und 3
  // (Dateien 05-evo-*.js, gezeichnet mit dem Baukasten ART.kit): Rumpf, Flossen/Arme, Muster und ein Merkmal der Art; hd verankert das Zubehör am Kopf.
  const mix = (a, b, t) => { const c = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = c(a), y = c(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const funkel = (cx, cy, R) => `<path d="M${cx} ${cy - R} Q${cx + R * 0.16} ${cy - R * 0.16} ${cx + R} ${cy} Q${cx + R * 0.16} ${cy + R * 0.16} ${cx} ${cy + R} Q${cx - R * 0.16} ${cy + R * 0.16} ${cx - R} ${cy} Q${cx - R * 0.16} ${cy - R * 0.16} ${cx} ${cy - R}Z" fill="#FFF3A8" stroke="${INK}" stroke-width="2.4"/>`;

  const evoArten = {};
  const sym = b => `${b}<g transform="translate(200 0) scale(-1 1)">${b}</g>`;      // links gezeichnet, rechts gespiegelt
  const klinge = (ax, ay, bx, by, tx, ty, k = 0.18, fill = '#fff', ex = '') => {   // gebogene Flosse/Stachel: Basis A–B, Spitze T; k > 0 = geschwungen (hohl), k < 0 = blattförmig (bauchig)
    const kk = k * (Math.sign((tx - ax) * (by - ay) - (ty - ay) * (bx - ax)) || 1);      // Drehsinn des Dreiecks ausgleichen
    const q = (px, py, qx, qy) => `${((px + qx) / 2 - (qy - py) * kk).toFixed(1)} ${((py + qy) / 2 + (qx - px) * kk).toFixed(1)}`;
    return `<path d="M${ax} ${ay} Q${q(ax, ay, tx, ty)} ${tx} ${ty} Q${q(tx, ty, bx, by)} ${bx} ${by}Z" fill="${fill}" ${ex}/>`;
  };
  const welle = (x, y, n, w = 10, h = 5) => `M${x} ${y} q${w / 2} ${-h} ${w} 0` + ` t${w} 0`.repeat(n - 1);   // Wellenlinie mit n Bögen
  const stacheln = (cx, cy, r, winkel, len, w, fill) => winkel.map(a => {      // Stacheln auf einem Kreis (Winkel in Grad, 0 = rechts, −90 = oben)
    const t = a * Math.PI / 180, ux = Math.cos(t), uy = Math.sin(t), nx = -uy, ny = ux;
    return `<path d="M${(cx + ux * r + nx * w).toFixed(1)} ${(cy + uy * r + ny * w).toFixed(1)} L${(cx + ux * (r + len)).toFixed(1)} ${(cy + uy * (r + len)).toFixed(1)} L${(cx + ux * r - nx * w).toFixed(1)} ${(cy + uy * r - ny * w).toFixed(1)}Z" fill="${fill}"/>`;
  }).join('');
  const brauen = (x, y, ex, s = 1) => `<path d="M${x - ex - 11 * s} ${y - 19 * s} L${x - ex + 9 * s} ${y - 12 * s} M${x + ex + 11 * s} ${y - 19 * s} L${x + ex - 9 * s} ${y - 12 * s}" fill="none" stroke-width="5"/>`;
  const augeA = (x, y, r, iris) => `<g class="aug"><g class="auf"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x + 1}" cy="${y + 1}" r="${r * 0.74}" fill="${iris}" stroke-width="2"/><circle cx="${x + 1.5}" cy="${y + 1.5}" r="${r * 0.4}" fill="${INK}" stroke="none"/><circle cx="${x + r * 0.32}" cy="${y - r * 0.26}" r="${r * 0.26}" fill="#fff" stroke="none"/></g>${zuBogen(x, y, r)}</g>`;
  function evoAura(stufe, p, fid) {                               // Schein hinter der Figur (Stufe 3 stärker, mit drehenden Strahlen) und Funkeln davor
    const hoch = stufe === 3, ag = 'ag_' + fid;
    const defs = `<radialGradient id="${ag}" cx="50%" cy="50%" r="50%"><stop offset="0.35" stop-color="${mix(p.a, '#ffffff', 0.35)}" stop-opacity="${hoch ? 0.6 : 0.4}"/><stop offset="1" stop-color="${p.a}" stop-opacity="0"/></radialGradient>`;
    let aura = `<circle cx="100" cy="108" r="${hoch ? 104 : 98}" fill="url(#${ag})" stroke="none"/>`;
    if (hoch) {
      let st = ''; for (let i = 0; i < 14; i++) st += `<path transform="rotate(${(i * 360 / 14).toFixed(1)} 100 108)" d="M100 108 L94 2 L106 2Z"/>`;
      aura += `<g fill="#fff" opacity=".22" stroke="none">${st}<animateTransform attributeName="transform" type="rotate" from="0 100 108" to="360 100 108" dur="36s" repeatCount="indefinite"/></g>`;
    }
    const vorn = (hoch ? [[16, 34, 10], [186, 46, 8], [180, 172, 9], [20, 166, 7]] : [[18, 40, 8], [184, 60, 7]]).map(a => funkel(...a)).join('');
    return { defs, aura, vorn };
  }

'use strict';
// ---------- Mythen der Tiefe: Fabelwesen und Gegenstände mit mystischem Leuchten ----------
// Sie stecken nicht im Riff-Laden und nicht in der Freunde-Serie. Man findet sie sehr selten in Muscheln und in Überraschungspaketen.
// Jede Zeichnung hat eine pulsierende Aura und funkelnde Sterne (SVG-Animation). Im Riff leuchten sie nachts stärker.
// Aufbau je Eintrag: wesen = schwimmt im Riff herum (Freund-Verhalten), sonst Gegenstand; bew = Bewegungsart (siehe BEWEGUNG in 14z-riffleben);
// freude = Freuden-Bewegungen; emit = [Teilchen je Sekunde, Art, Steighöhe] für Gegenstände; basis = Breite im Riff (Einheiten).
const MYTH_RAR = { name: 'Mythisch', farbe: '#C46BFF', serie: 'Mythen der Tiefe' };
const MYTH = {};
const mythSvg = id => MYTH[id].svg();
const mythIds = () => Object.keys(MYTH);
(() => {
  const I = INK, K = ART.kit, T = ART.T, eye = ART.eye;
  const W = b => `<g stroke="${I}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${b}</g>`;
  const fk = (x, y, R, d = 0, f = '#FFF7C2') => `<path d="M${x} ${y - R}Q${x + R * .16} ${y - R * .16} ${x + R} ${y}Q${x + R * .16} ${y + R * .16} ${x} ${y + R}Q${x - R * .16} ${y + R * .16} ${x - R} ${y}Q${x - R * .16} ${y - R * .16} ${x} ${y - R}Z" fill="${f}" stroke="${I}" stroke-width="2.2"><animate attributeName="opacity" values="1;.3;1" dur="${(2.2 + d * .7).toFixed(1)}s" begin="${d}s" repeatCount="indefinite"/></path>`;
  const aura = (id, c, cy = 104, r = 94) => `<radialGradient id="mg_${id}" cx="50%" cy="50%" r="50%"><stop offset=".28" stop-color="${c}" stop-opacity=".85"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  const auraKreis = (id, cy = 104, r = 94) => `<circle cx="100" cy="${cy}" r="${r}" fill="url(#mg_${id})" stroke="none"><animate attributeName="opacity" values=".6;1;.6" dur="3.4s" repeatCount="indefinite"/></circle>`;
  const lin = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const rund = (id, mitte, rand) => `<radialGradient id="${id}" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="${mitte}"/><stop offset="1" stop-color="${rand}"/></radialGradient>`;
  const huelle = (id, glow, defs, body, vorn, cy, r) => `<svg class="myth" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${aura(id, glow)}${defs || ''}</defs>${auraKreis(id, cy, r)}${W(body)}${vorn || ''}</svg>`;
  const bez = (p, t) => { const u = 1 - t; return [u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6], u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]]; };
  const dbez = (p, t) => { const u = 1 - t; return [3 * u * u * (p[2] - p[0]) + 6 * u * t * (p[4] - p[2]) + 3 * t * t * (p[6] - p[4]), 3 * u * u * (p[3] - p[1]) + 6 * u * t * (p[5] - p[3]) + 3 * t * t * (p[7] - p[5])]; };

  }).join('');

function rundeEnde(u, P, sess) {
  const d = heute();

  const fehler = sess.antworten.filter(a => a.r === 0).length;
  const perfekt = fehler === 0 && erste.length >= 5 && !sess.abbruch;
  const sum_ = { xp: sess.xp, perlen: sess.perlen, perl: 0, schatz: 0, perfekt, fehler, richtig: erste.filter(a => a.r >= 2).length, n: erste.length, zeilen: [], tagesziele: [], meilen: [], serie: null, rang: null };
  const abbruch = !!sess.abbruch;                                // vorzeitig beendet: keine Rundenbelohnung, aber erreichte Tagesziele zählen
  const extra = { xp: 0, perlen: 0 };
  const t = u.tage[d] || (u.tage[d] = { n: 0, ok: 0 });
  if (!abbruch) {
    u.stats.runden++; t.runden = (t.runden || 0) + 1;
    extra.xp += R.xp.runde; extra.perlen += R.perlen.runde;
    if (perfekt) { u.stats.perfekt = (u.stats.perfekt || 0) + 1; extra.xp += R.xp.perfekt; extra.perlen += R.perlen.perfekt; sum_.zeilen.push({ ico: 'stern', t: 'Runde ohne Fehler', xp: R.xp.perfekt, perlen: R.perlen.perfekt }); }
  }

  sess.treffer.forEach(pid => {
    const p = u.projects[pid]; if (!p || p.belohntAm === d) return;         // pro Projekt und Tag nur einmal (auch wenn der Plan neu berechnet wurde)
    p.belohntAm = d;
    u.stats.tagesziele++;
    const z = { name: p.name, pid, xp: R.xp.tagesziel, perlen: R.perlen.tagesziel, perl: 1, schatz: 0, serie: null, wochenMuschel: false, serieMuschel: false };
    if (!p.dauer) {
      const s = serieFortsetzen(p);
      z.serie = s;
      const bonus = Math.min(s.cur, R.perlen.serieMax);
      z.perlen += bonus;
      if (s.cur % 7 === 0) { z.schatz++; z.serieMuschel = true; }                // alle 7 Tage Strömung: Schatzmuschel
      else if (s.cur === 3) { z.perl++; z.serieMuschel = true; }
    } else {
      const w = wochenZaehlen(p);
      if (w.tage.length >= 3 && !w.muschel) { w.muschel = true; z.wochenMuschel = true; z.schatz++; }
    }
    sum_.tagesziele.push(z);
    extra.xp += z.xp; extra.perlen += z.perlen; sum_.perl += z.perl; sum_.schatz += z.schatz;
  });
  // Meilensteine
  projekte(u).filter(p => p.status === 'aktiv').forEach(p => {
    const pct = stand(u, p).pct;
    [25, 50, 75, 100].forEach(m => {
      if (pct * 100 >= m && !p.meilen[m] && stand(u, p).n > 0) {
        p.meilen[m] = Date.now();
        const pe = R.perlen.meilen[m];
        extra.perlen += pe; if (m === 50 || m === 75) sum_.perl++;
        if (m === 100) sum_.schatz++;
        sum_.meilen.push({ name: p.name, m, perlen: pe });
      }

  const tAlt = u.tiefeMax || 0, tNeu = tiefeNach(u);
  sum_.tiefe = tNeu; sum_.zonen = RAR.filter(r => r.tiefe > 0 && r.tiefe > tAlt && r.tiefe <= tNeu);
  sum_.zonen.forEach(() => { extra.perlen += 10; sum_.schatz++; });
  sum_.xp += extra.xp; sum_.perlen += extra.perlen;
  const rg = gib(u, { xp: sum_.xp - sess.xp, perlen: sum_.perlen - sess.perlen, perl: sum_.perl, schatz: sum_.schatz });
  sum_.rang = sess.rang || rg;
  sum_.abzeichen = pruefeAbzeichen(u);
  sichere();
  return sum_;
}

function gehe(name, p) { V = { name, p: p || {} }; if (name !== 'riff' && typeof riffVollEnde === 'function') riffVollEnde(); render(true); }
function render(hoch) {
  const f = ANSICHT[V.name];
  const main = $('.main');
  const y = main && !hoch ? main.scrollTop : 0;
  $('#app').innerHTML = f();
  const m2 = $('.main'); if (m2 && y) m2.scrollTop = y;

function nachRender() {
  $$('img[data-img]').forEach(im => {
    if (im.getAttribute('src')) return;
    imgUrl(im.dataset.img).then(u => { if (u && im.isConnected) im.src = u; });
  });
  if (V.nach) { const n = V.nach; n(); }
}

function toast(text, ic, ms) {

function schwebZahl(el, text) {                                   // „+2“ steigt aus einem Element auf
  const r = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'schwebzahl'; s.textContent = text;
  s.style.left = (r.left + r.width / 2 - 20) + 'px'; s.style.top = (r.top + 4) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
}

// ---------- Effekte: Luftblasen und Konfetti auf einer Leinwand ----------
const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d');
  let W = 0, H = 0, parts = [], amb = [], laeuft = false, last = 0;
  const reduziert = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function groesse() { const d = Math.min(2, window.devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d; cv.dataset.d = d; }
  window.addEventListener('resize', groesse); groesse();
  for (let i = 0; i < (reduziert ? 0 : 12); i++) amb.push({ x: rand(), y: rand(), r: 4 + rand() * 12, v: 0.008 + rand() * 0.016, w: rand() * 6 });
  function schritt(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const d = +cv.dataset.d || 1;
    g.clearRect(0, 0, W, H);
    amb.forEach(b => {
      b.y -= b.v * dt * 4; b.w += dt;
      if (b.y < -0.05) { b.y = 1.05; b.x = rand(); }
      const x = (b.x + Math.sin(b.w) * 0.01) * W, y = b.y * H, r = b.r * d;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = 'rgba(255,255,255,.16)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2 * d; g.stroke();
      g.beginPath(); g.arc(x - r * .35, y - r * .35, r * .22, 0, 7); g.fillStyle = 'rgba(255,255,255,.7)'; g.fill();
    });
    parts = parts.filter(p => p.l > 0);
    parts.forEach(p => {
      p.l -= dt; p.vy += p.gr * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      g.save(); g.globalAlpha = clamp(p.l / p.l0 * 1.6, 0, 1); g.translate(p.x * d, p.y * d); g.rotate(p.rot);
      if (p.bubble) { g.beginPath(); g.arc(0, 0, p.s * d, 0, 7); g.fillStyle = 'rgba(255,255,255,.35)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2 * d; g.stroke(); }
      else { g.fillStyle = p.c; g.fillRect(-p.s * d, -p.s * .5 * d, p.s * 2 * d, p.s * d); }
      g.restore();
    });
    if (document.visibilityState === 'hidden') { laeuft = false; return; }
    requestAnimationFrame(schritt);
  }
  function an() { if (!laeuft && !reduziert) { laeuft = true; last = performance.now(); requestAnimationFrame(schritt); } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') an(); });
  an();
  const FARBEN = ['#FFC83D', '#FF7A59', '#1FB6C6', '#8E6BE0', '#FF8FB3', '#2FB38A', '#fff'];
  return {
    blasen(x, y, n) { if (reduziert) return; for (let i = 0; i < (n || 12); i++) parts.push({ x, y, vx: (rand() - .5) * 160, vy: -40 - rand() * 160, gr: -30, s: 4 + rand() * 9, l: 1 + rand() * 0.9, l0: 1.6, rot: 0, vr: 0, bubble: true }); an(); },
    konfetti(n) { if (reduziert) return; for (let i = 0; i < (n || 80); i++) parts.push({ x: innerWidth * (0.15 + rand() * 0.7), y: innerHeight * 0.25, vx: (rand() - .5) * 520, vy: -260 - rand() * 380, gr: 760, s: 5 + rand() * 5, l: 2 + rand() * 1.2, l0: 2.8, rot: rand() * 6, vr: (rand() - .5) * 14, c: FARBEN[Math.floor(rand() * FARBEN.length)] }); an(); }
  };
})();

// ---------- Hafen ----------
function floText(u, sp) {
  const ps = projekte(u, sp).filter(istAktiv);
  const name = esc(u.name);
  if (V.p.neu) return [`Hallo ${name}! Ich bin Flo und tauche mit dir durch die Wörter.`, 'Du hast schon eine Muschel – tipp oben auf die Muschel und schau, wer drin steckt!'];
  if (!hatKarten('en') && !hatKarten('fr')) return [`Hallo ${name}! Zuerst brauche ich Karten.`, 'Tipp auf „Karten“ und zieh deine Kartenordner hinein.'];
  if (!hatKarten(sp)) return [`Für ${SPRECHE_NAME[sp]} habe ich noch keine Karten.`, 'Du kannst sie unter „Karten“ hinzufügen.'];
  if (!ps.length) return ['Lege ein Projekt an, zum Beispiel für deine nächste Klassenarbeit.', 'Du bestimmst, wie lange und wie gründlich.'];
  const heutige = ps.map(p => ({ p, pl: heutePlan(u, p) }));
  const offen = heutige.filter(x => x.pl.ziel > 0 && !x.pl.fertig);
  const naechster = ps.filter(p => p.end).sort((a, b) => a.end.localeCompare(b.end))[0];
  const tage = naechster ? diffTage(heute(), naechster.end) : null;
  if (offen.length) {
    const x = offen[0], rest = x.pl.ziel - planGeschafft(x.pl);
    return [`Heute dran: noch ${rest} ${rest === 1 ? 'Karte' : 'Karten'} für „${esc(x.p.name)}“.`, tage != null && tage <= 14 ? `Noch ${tage} ${tage === 1 ? 'Tag' : 'Tage'} bis „${esc(naechster.name)}“ – du bist auf Kurs.` : 'Los geht’s, ich bin dabei!'];
  }
  if (heutige.some(x => x.pl.fertig)) return ['Tagesziel geschafft – sauber getaucht!', 'Eine Bonusrunde geht immer, muss aber nicht.'];
  return ['Heute ist nichts fällig. Alles sitzt!', 'Wenn du magst: Bonusrunde zum Auffrischen.'];
}
const SPRECHE_NAME = { en: 'Englisch', fr: 'Französisch' };

function countdownChip(P) {
  if (P.dauer || !P.end) return '<span class="chip klein">Dauerprojekt</span>';
  const t = diffTage(heute(), P.end);
  if (t === 0) return '<span class="chip klein rot">Heute ist der Termin!</span>';
  return `<span class="chip klein ${t <= 3 ? 'rot' : ''}">${ico('kalender')} noch ${t} ${t === 1 ? 'Tag' : 'Tage'}</span>`;
}
function serieChip(P) {
  if (P.dauer) {
    const w = (P.wochen[wochenStart(heute())] || { tage: [] }).tage.length;
    return `<span class="flamme ${w ? '' : 'aus'}" title="Wochenziel">${FLAMME}${w}/3 Tage diese Woche</span>`;
  }
  const s = serieJetzt(P);
  return `<span class="flamme ${s ? '' : 'aus'}" title="Strömung">${FLAMME}${s ? s + (s === 1 ? ' Tag' : ' Tage in Folge') : 'Strömung startet heute'}</span>`;
}
function projektKarte(u, P) {
  const st = stand(u, P), pl = heutePlan(u, P);
  const done = planGeschafft(pl), z = pl.ziel;
  const rest = Math.max(0, z - done);
  const pct = z ? done / z : 1;
  const inner = pl.ruhetag ? `<span class="fred" style="font-size:15px">Ruhetag</span>` : z ? `<span class="fred" style="font-size:26px">${done}</span><small style="display:block;font-size:13px;color:var(--mut)">von ${z}</small>` : `${ico('haken')}`;
  const ringHtml = ring(pct, 104, pl.fertig || !z ? 'var(--gruen)' : 'var(--sp)', inner);
  const label = pl.fertig || (!z) ? 'Bonusrunde' : done ? 'Weitertauchen' : 'Tauchen!';
  const ZZ = ziel_(P.ziel);
  const marke = Math.round(st.pct * 100);
  return `<div class="panel pk sp-${P.sp}"><div class="kopfz"><span class="spbadge">${SPRECHE_NAME[P.sp].toUpperCase()}</span><h3>${esc(P.name)}</h3>${countdownChip(P)}</div>
    <div class="mitte">${ringHtml}<div class="info">
      <div class="zeile"><span>Tauchtiefe: <b>${marke} %</b> · Ziel „${ZZ.name}“</span></div>
      <div class="tiefe"><b style="width:${Math.max(3, marke)}%"></b><i style="left:${clamp(Math.max(3, marke), 3, 97)}%">${TAUCHER}</i></div>
      <div class="zeile"><span>${st.ok} von ${st.n} Karten</span><span class="sp1"></span>${serieChip(P)}</div></div></div>
    <div class="aktion"><button class="btn sp-farbe gross" data-a="lernStart" data-v="${P.id}" ${st.n ? '' : 'disabled'}>${ico('hafen')} ${label}${!pl.fertig && rest ? ` <small style="font:600 15px Inter;opacity:.9">(${rest} ${rest === 1 ? 'Karte' : 'Karten'})</small>` : ''}</button><button class="btn weiss" data-a="projektDetail" data-v="${P.id}" aria-label="Details">${ico('info')}</button></div><div class="aktion probezeile"><button class="btn klein weiss" data-a="probeNeu" data-v="${P.id}" ${st.n ? '' : 'disabled'}>${ico('stern')} Generalprobe</button></div></div>`;
}
function logbuchKarte(P, u) {
  const e = P.ergebnis || { pct: 0, n: 0 };
  return `<div class="panel pk sp-${P.sp}"><div class="kopfz"><span class="spbadge">${SPRECHE_NAME[P.sp].toUpperCase()}</span><h3>${esc(P.name)}</h3><span class="chip klein">${datumDe(P.end)} beendet</span></div>
    <div class="zeile mut">Am Ende gelernt: <b class="fred" style="color:var(--navy)">${Math.round(e.pct * 100)} %</b> von ${e.n} Karten · Strömung bis ${P.serie.best} ${P.serie.best === 1 ? 'Tag' : 'Tagen'}

}

const IMP = { laeuft: false, text: '', i: 0, n: 0, bericht: null };

function lektionKachel(L) {
  const sp = SPRACHE[L.sp];
  const nKarten = Object.keys(L.cards).length;
  const saetze = {};
  Object.values(L.cards).forEach(c => { saetze[c.satz] = (saetze[c.satz] || 0) + 1; });
  const chips = SATZ_REIHE.concat(Object.keys(saetze).filter(s => SATZ_REIHE.indexOf(s) < 0)).filter(s => saetze[s]).map(s => `<span class="chip klein">${esc(satzInfo(s).kurz)} · ${saetze[s]}</span>`).join('');
  return `<div class="panel lk sp-${L.sp}"><div class="zeile"><span class="spbadge">${sp.name.toUpperCase()}</span><h3>${esc(L.titel)}</h3>
    <button class="btn klein weiss" data-a="lektionWeg" data-v="${L.key}" aria-label="Lektion löschen">${ico('muelleimer')}</button></div>
    <div class="mut" style="font-size:14px">${L.buch ? esc(L.buch) + ' · ' : ''}${nKarten} Karten (${nKarten * 2} Bilder)</div>
    <div class="sets">${chips}</div>
    <div style="margin-top:8px">${L.hasText ? '<span class="chip klein gruen">' + ico('haken') + ' mit Text: Vorlesen und Quiz möglich</span>' : '<span class="chip klein gold">nur Bilder: Karten umdrehen</span>'}</div></div>`;
}

ANSICHT.bibliothek = () => {
  const ls = Object.values(S.lib.lessons).sort((a, b) => a.sp.localeCompare(b.sp) || a.nr - b.nr);
  const b = IMP.bericht;
  const prog = IMP.laeuft ? `<div class="panel fortschritt"><div class="zeile"><h3 class="sp1">${esc(IMP.text)}</h3><span class="zahl">${IMP.n ? Math.round(IMP.i / IMP.n * 100) : 0} %</span></div><div class="leiste" style="margin-top:10px"><b id="impBalken" style="width:${IMP.n ? IMP.i / IMP.n * 100 : 3}%"></b></div></div>` : '';
  let ber = '';
  if (b && !IMP.laeuft) {
    const ok = b.neu + b.aktualisiert;
    const teile = [];

  [['fOrdner'], ['fDateien'], ['fZip']].forEach(([id]) => { const f = $('#' + id); if (f) f.addEventListener('change', () => { const l = Array.from(f.files); f.value = ''; if (l.length) impStart(async () => l); }); });

async function impStart(hole) {
  if (IMP.laeuft) { toast('Es läuft noch ein Einlesen …', 'uhr'); return; }
  IMP.laeuft = true; IMP.bericht = null; IMP.text = 'Dateien werden gelesen …'; IMP.i = 0; IMP.n = 0;
  render();
  let dateien = [], ordner = false, diag = null;
  try {
    const r = await hole();
    if (Array.isArray(r)) dateien = r; else { dateien = r.dateien || []; ordner = !!r.ordner; diag = r.diag || null; }
  } catch (e) { dateien = []; diag = { fehler: [String((e && e.message) || e)] }; }
  let b;
  try {
    b = await importiere(dateien, (txt, i, n) => {
      IMP.text = txt; IMP.i = i; IMP.n = n;
      const bar = $('#impBalken'); if (bar) bar.style.width = (n ? i / n * 100 : 0) + '%';
      const h3 = $('.fortschritt h3'); if (h3) h3.textContent = txt;
      const z = $('.fortschritt .zahl'); if (z) z.textContent = (n ? Math.round(i / n * 100) : 0) + ' %';
    });
  } catch (e) { b = { neu: 0, aktualisiert: 0, lektionen: [], ohneText: [], unvollstaendig: [], ignoriert: 0, fehler: [String(e.message || e)] }; }
  b.ordner = ordner && b.neu + b.aktualisiert === 0; b.diag = diag;
  IMP.laeuft = false; IMP.bericht = b;
  if (b.neu + b.aktualisiert) { TON.spiel('fertig'); FX.blasen(innerWidth / 2, innerHeight / 2, 30); }
  if (V.name === 'bibliothek') render();
}

function editDist(a, b) {                                          // Levenshtein mit Buchstabendreher (candel ≈ candle = 1)

// Beginnt die Eingabe (Wort für Wort, Leerzeichen egal) mit dem Pflichtteil? „en France“ passt zu „en“, „english“ nicht.

function eingabeMarkiert(eingabe, loes, artikel) {

function tippPruefung(eingabe, t) {

  if (v.muster.some(m => m.test(k))) return { art: 'richtig', r: 2 };

  if (v.ok.some(x => ohneAkzent(x) === ka) || v.praefix.some(p => beginntMit(e, p, ohneAkzent))) return { art: 'akzent', r: 1 };

    ${noch ? `<div class="pfliste"><h3>Das solltest du dir noch einmal ansehen</h3>${e.falschListe.map(c => zeile(c, 'f')).join('')}${e.wackelListe.map(c => zeile(c, 'w')).join('')}</div>` : (e.n ? '<div class="hinweisbox gruen" style="width:100%">Alles gewusst. So kannst du in den Test gehen!</div>' : '')}

  return `<svg class="paketbild s${stufe}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <path d="M100 66C72 26 38 40 58 64C70 76 92 72 100 66Z" fill="${c.band}"/><path d="M100 66C128 26 162 40 142 64C130 76 108 72 100 66Z" fill="${c.band}"/><circle cx="100" cy="66" r="10" fill="${c.band}"/>
    <path d="M44 106v68" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none"/></g>${stufe >= 3 ? `<path d="${ART.star(170, 52, 12, 4, 4)}" fill="#FFF3A8" stroke="${INK}" stroke-width="2.5"/><path d="${ART.star(28, 40, 9, 3, 4)}" fill="#FFF3A8" stroke="${INK}" stroke-width="2.5"/>` : ''}</svg>`;
}

function paketPreisHtml(x, i) {

const paketTon = x => (x.typ === 'myth' ? 'legende' : x.typ === 'freund' ? ['perle', 'selten', 'episch', 'legende'][x.res.rar] : x.typ === 'deko' ? 'kauf' : 'perle');

// ---------- Mythen der Tiefe im Album ----------
function mythAlbum(u) {
  const ids = mythIds(), haben = ids.filter(i => mythBesitz(u)[i]).length;
  return `<div class="serie myth"><h3><span style="color:${MYTH_RAR.farbe}">✦</span> ${MYTH_RAR.serie} <small class="mut" style="font:600 15px Inter">${haben}/${ids.length} · ${MYTH_RAR.name}</small></h3>

};
// Welt-Hintergrund: ab der zweiten Reihe läuft das Wasser Zone für Zone ins Dunkle (Farbe an der Unterkante der Reihe 0–3)
const ZONEHG = [null, '#2F8CC4', '#143E7A', '#0A1F45', '#050B22'];
const ZONESAND = [null, ['#D9BE8C', '#B39562'], ['#6A6890', '#4A486E'], ['#3B3B63', '#23233F']];   // Sand der untersten Reihe ab Reihe 1
const ZONEKARTE = ['#7FD6EA', '#2F8CC4', '#143E7A', '#0A1F45'];
const RIFF = { ratio: 1.6, u: 6, v: 4, alles: false, scroll: null, voll: false };   // u/v: Pixel je Einheit (1 Einheit = 1 % einer Kachel)
const lum = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11; };
function riffWasser(rows, c) {
  if (rows === 1) return `linear-gradient(180deg,${c[0]},${c[1]})`;
  let prev = c[0]; const st = [`${c[0]} 0%`];
  for (let k = 1; k <= rows; k++) {
    const z = ZONEHG[k], f = k === 1 && lum(c[1]) < lum(z) ? c[1] : z;
    if (lum(f) < lum(prev)) prev = f;                              // nie heller als darüber
    st.push(`${prev} ${k / rows * 100}%`);
  }
  return `linear-gradient(180deg,${st.join(',')})`;
}

function riffZonenHtml(W) {
  const out = [];
  for (let r = 0; r < W.rows; r++) for (let c = 0; c < W.cols; c++) {
    const h = hashStr((c - W.e.l) + ':' + r), z = SIL[r];
    const sil = (s, st, sp, c) => `<svg class="sil ${c || ''}" viewBox="0 0 100 ${s[0]}" style="${st};color:${SILF[r]}${sp ? ';transform:scaleX(-1)' : ''}" aria-hidden="true">${s[1]}</svg>`;
    let inner = `<div class="zlabel">${esc(RAR[r].zone)}${RAR[r].tiefe ? ` · ab ${RAR[r].tiefe} m` : ''}</div>` +
      sil(z.f[(h >>> 3) % z.f.length], `left:${10 + (h >>> 5) % 55}%;top:${14 + (h >>> 9) % 34}%;width:${16 + (h >>> 13) % 10}%`, (h >>> 1) & 1, 'fl');
    if (r === W.rows - 1) {
      inner += sil(z.b[h % z.b.length], `left:${3 + (h >>> 4) % 20}%;bottom:7%;width:${22 + (h >>> 7) % 12}%`, (h >>> 2) & 1) +
        sil(z.b[(h >>> 6) % z.b.length], `left:${54 + (h >>> 8) % 24}%;bottom:7%;width:${16 + (h >>> 11) % 12}%`, (h >>> 3) & 1);
    }
    out.push(`<div class="zelle" style="left:${c / W.cols * 100}%;top:${r / W.rows * 100}%;width:${100 / W.cols}%;height:${100 / W.rows}%">${inner}</div>`);
  }
  return out.join('');
}

function riffSetze(kind, ref) {
  const u = cur(), W = riffWelt(u), b = $('#buehne'), wrap = $('#riffwrap');
  let x = 14 + rand() * 72, y = 55 + rand() * 38;                  // ohne Riff-Ansicht: in der Start-Kachel
  if (b && wrap) {                                                // sonst im sichtbaren Ausschnitt, in der unteren Hälfte
    const br = b.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    x = W.minX + ((wr.left + wr.width / 2) - (br.left + 6)) / RIFF.u + (rand() - 0.5) * 40;
    y = (Math.min(wr.bottom, br.bottom - 6) - (br.top + 6)) / RIFF.v - 6 - rand() * 36;
  }
  const it = { id: uid(), kind, ref, x: clamp(x, W.minX + 8, W.minX + W.w - 8), y: clamp(y, 30, W.h - 2), s: 1, flip: rand() < 0.5 };
  u.riff.items.push(it);
  if (u.dekoNeu) delete u.dekoNeu[ref];
  const neu = pruefeAbzeichen(u); neu.forEach(b => toast(`Neues Abzeichen: ${BADGES[b].name}`, 'stern', 3200));
  return it;
}
const STUFENGROESSE = [1, 1.08, 1.2];                             // entwickelte Freunde sind im Riff etwas größer
const riffBasis = it => (it.kind === 'fig' ? 17 * STUFENGROESSE[stufeVon(cur(), it.ref) - 1] : it.kind === 'myth' ? MYTH[it.ref].basis : 13) * it.s;     // Breite in Einheiten (Prozent einer Kachel)
const riffLeft = (x, W) => `calc(${+(x - W.minX).toFixed(2)} * var(--u))`, riffTop = y => `calc(${+y.toFixed(2)} * var(--v))`;

// ---------- Blasensäulen & Co. ----------

// ---------- Freunde fragen Vokabeln ----------
// Ab und zu taucht über einem Freund ein „?“ auf. Tippt man es (oder den Freund) an, stellt er eine Vokabelfrage aus den Karten, die man schon kennt

// Lektionen ihren Wert behalten: nur jede zweite richtige Antwort bringt eine Perle, höchstens FRAGE_MAX richtige Antworten am Tag zählen (= 3 Perlen),
// nach FRAGE_FEHLER falschen Antworten am Tag gibt es nichts mehr (kein Belohnen fürs Raten), Korallenfunken gibt es hier nicht. Das Ganze ist ein eigener **Modus**: Er ist beim Start aus und wird nur über den Buch-Knopf im Riff

  if (!cids.length) return null;

function lebenFrageWeg() { if (LEBEN.fz) { if (LEBEN.fz.el) LEBEN.fz.el.remove(); LEBEN.fz = null; } }

  const kand = u.riff.items.filter(it => { const a = lebenBeweglich(it) && LEBEN.ag.get(it.id); return a && a.modus !== 'schlafen' && a.modus !== 'verstecken' && lebenSichtbar(riffSicht(it), 0); });
  const b = $('#buehne');

AKT.riffFrage = el => frageStart(el.dataset.v);

// Ein goldener Stern taucht im Wasser auf (höchstens einmal am Tag, nach mindestens 90 s im Riff, Würfel alle 10 s mit 1,2 % Chance, also etwa alle 15–30 Minuten im Riff
// einmal, im Schnitt viel seltener). Antippen öffnet eine Karte mit den Regeln, „Los!“ startet 12 Sekunden Spiel:
//   Blasenregen      – leuchtende Blasen antippen, bevor sie oben ankommen; goldene zählen 3, Seeigel kosten 2 Punkte
//   Goldener Krebs   – ein goldener Krebs flitzt über den Sand; je öfter man ihn trifft, desto schneller wird er

function ereignisTokenWeg() { if (LEBEN.ereToken) { if (LEBEN.ereToken.el) LEBEN.ereToken.el.remove(); LEBEN.ereToken = null; } }

  if (tok) { if (LEBEN.zeit > tok.bis || EG) ereignisTokenWeg(); return; }
  if (LEBEN.ereT > 0) return;
  LEBEN.ereT = EREIGNIS.takt;

function ereignisHud(g) {

}
const IGEL_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="${ART.star(32, 32, 30, 14, 12)}" fill="#6B3F8F" stroke="#14253F" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="32" r="14" fill="#8E5BC4" stroke="#14253F" stroke-width="3"/><circle cx="26" cy="29" r="3" fill="#fff"/><circle cx="38" cy="29" r="3" fill="#fff"/><path d="M26 39q6 -4 12 0" fill="none" stroke="#14253F" stroke-width="3" stroke-linecap="round"/></svg>`;
function ereignisLauf(g) {
  g.phase = 'laeuft'; g.liste = []; g.spawn = 0; g.letzt = performance.now(); g.tempo = 1;
  const feld = $('#efeld'); if (!feld) { EG = null; return; }

    el.addEventListener('pointerdown', ev => { ev.preventDefault(); ereignisKrebsTreffer(g, ev); });
  }
  const tick = ts => {
    if (EG !== g || !$('#efeld')) { if (EG === g) EG = null; return; }
    const dt = Math.min(0.05, (ts - g.letzt) / 1000); g.letzt = ts; g.zeit -= dt;
    const W = feld.clientWidth, H = feld.clientHeight;
    if (g.spiel === 'blasen') ereignisBlasenTick(g, feld, dt, W, H); else ereignisKrebsTick(g, dt, W, H);
    ereignisHud(g);
    if (g.zeit <= 0) { ereignisEnde(g); return; }
    requestAnimationFrame(tick);
  };
  ereignisHud(g); requestAnimationFrame(tick);
}
function ereignisBlasenTick(g, feld, dt, W, H) {
  const fortschritt = 1 - g.zeit / EREIGNIS.dauer;
  g.spawn -= dt;
  if (g.spawn <= 0) {
    g.spawn = 0.34 - fortschritt * 0.08 + rand() * 0.1;
    const r = rand(), typ = r < 0.12 ? 'igel' : r < 0.27 ? 'gold' : 'normal', gr = typ === 'gold' ? 54 : 58 + rand() * 20;
    const el = document.createElement('div'); el.className = 'eblase ' + typ; el.style.width = el.style.height = gr + 'px';
    if (typ === 'igel') el.innerHTML = IGEL_SVG;
    const b = { el, x: gr / 2 + rand() * (W - gr), y: H + gr, vy: (typ === 'gold' ? 190 : 120) + rand() * 80 + fortschritt * 70, typ, gr, tot: false, ph: rand() * 6.28 };
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); ereignisBlase(g, b); });
    feld.appendChild(el); g.liste.push(b);
  }
  for (let i = g.liste.length - 1; i >= 0; i--) {
    const b = g.liste[i];
    if (b.tot) { g.liste.splice(i, 1); continue; }
    b.y -= b.vy * dt;
    const wx = Math.sin(performance.now() / 600 + b.ph) * 10;
    b.el.style.transform = `translate(${(b.x - b.gr / 2 + wx).toFixed(1)}px,${(b.y - b.gr / 2).toFixed(1)}px)`;
    if (b.y < -b.gr) { b.el.remove(); g.liste.splice(i, 1); }
  }
}
function ereignisBlase(g, b) {
  if (EG !== g || g.phase !== 'laeuft' || b.tot) return;
  b.tot = true;
  const r = b.el.getBoundingClientRect();
  if (b.typ === 'igel') { g.punkte = Math.max(0, g.punkte - 2); TON.spiel('schwer'); b.el.classList.add('aua'); }
  else { g.punkte += b.typ === 'gold' ? 3 : 1; g.treffer++; TON.spiel(b.typ === 'gold' ? 'selten' : 'perle'); b.el.classList.add('platzt'); FX.blasen(r.left + r.width / 2, r.top + r.height / 2, b.typ === 'gold' ? 12 : 6); }
  setTimeout(() => b.el.remove(), 260);
}
function ereignisKrebsTick(g, dt, W, H) {
  const k = g.krebs; if (!k) return;
  k.wechsel -= dt;
  if (k.wechsel <= 0) { k.wechsel = 0.5 + rand() * 0.9; k.vx = (rand() < 0.5 ? -1 : 1) * (150 + rand() * 120); k.hop = 0.35; }
  k.x += k.vx * g.tempo * dt;
  const gr = Math.min(120, W * 0.14);
  if (k.x < gr / 2) { k.x = gr / 2; k.vx = Math.abs(k.vx); } else if (k.x > W - gr / 2) { k.x = W - gr / 2; k.vx = -Math.abs(k.vx); }
  k.hop = Math.max(0, k.hop - dt);
  const spring = Math.sin(k.hop / 0.35 * Math.PI) * 36, y = H * 0.74 - spring;
  k.el.style.width = k.el.style.height = gr + 'px';
  k.el.style.transform = `translate(${(k.x - gr / 2).toFixed(1)}px,${(y - gr / 2).toFixed(1)}px) scaleX(${k.vx < 0 ? 1 : -1})`;
}
function ereignisKrebsTreffer(g, ev) {

}

'use strict';
// ---------- Web-App: Service Worker, Updates, Kartenpakete aus dem Repo, Umzug ----------
// Läuft die App von einer Webadresse (https, z. B. GitHub Pages), gilt: Offline-Kopie per Service Worker, Update-Prüfung beim Start und beim
// Zurückkehren, neue Kartenpakete aus karten/ werden von selbst eingelesen. Als lokale Datei (file://) ist das alles aus, der Rest läuft wie bisher.
// Kartenpakete: karten/index.json (vom Repo-Bau erzeugt) plus – falls erreichbar – das GitHub-Verzeichnis karten/, damit auch von Hand
// hochgeladene ZIP-Dateien gefunden werden. Was schon geladen wurde, steht nur auf diesem Gerät (kv „repo“), nicht in der Sicherung.
const UPD = { web: /^https?:$/.test(location.protocol), reg: null, wartet: null, geprueft: 0, laeuft: false, ergebnis: null, pakete: [], listeFehler: false, letzteEingabe: Date.now(), frage: null, neuLaden: false };
const istApp = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const istIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const appEinst = () => { S.einst = Object.assign({ autoUpdate: true, autoKarten: true }, S.einst || {}); return S.einst; };
document.addEventListener('pointerdown', () => { UPD.letzteEingabe = Date.now(); }, true);

// ---------- kleine Statusanzeige unten ----------
function updPille(text, pct, knoepfe) {
  let el = $('#updpille');
  if (!text) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'updpille'; el.className = 'updpille'; document.body.appendChild(el); }
  el.innerHTML = `<span class="t">${esc(text)}</span>${pct != null ? `<span class="bar"><b style="width:${Math.round(pct)}%"></b></span>` : ''}${(knoepfe || []).map(k => `<button class="btn klein ${k[2] || 'gold'}" data-a="${k[1]}">${esc(k[0])}</button>`).join('')}`;
}
function updPilleStand() {                                          // zeigt, was gerade wichtig ist (Update bereit / Frage zu Karten)
  if (UPD.wartet) updPille('Neue Version bereit.', null, [['Jetzt installieren', 'updateJetzt']]);
  else if (UPD.frage) updPille(`${UPD.frage.pakete.length} neue ${UPD.frage.pakete.length === 1 ? 'Kartenpaket' : 'Kartenpakete'} (${updMB(UPD.frage.bytes)} MB) gefunden.`, null, [['Laden', 'kartenFrageJa'], ['Später', 'kartenFrageNein', 'weiss']]);
  else updPille('');
}
const updMB = b => (b / 1048576 >= 10 ? Math.round(b / 1048576) : Math.round(b / 104857.6) / 10).toLocaleString('de-DE');

// ---------- Service Worker (Offline-Kopie und App-Update) ----------
function updSwStart() {
  if (!UPD.web || !('serviceWorker' in navigator)) return;
  let hatteSteuerung = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {           // neuer Service Worker hat übernommen → neu laden (nicht beim allerersten Installieren)
    if (!hatteSteuerung) { hatteSteuerung = true; return; }
    if (UPD.neuLaden) return;
    UPD.neuLaden = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    UPD.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) updNeuWartet(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) updNeuWartet(nw); });
    });
  }).catch(() => { /* kein Service Worker: die App läuft trotzdem */ });
}
function updNeuWartet(sw) { UPD.wartet = sw; updPilleStand(); if (V.name === 'ich') ichUpdateStatus(); }
async function updateAnwenden() {
  if (!UPD.wartet) { UPD.neuLaden = true; location.reload(); return; }
  updPille('Update wird installiert …', null);
  try { await sichereJetzt(); } catch (e) { /* weiter */ }
  UPD.wartet.postMessage('skip');
  setTimeout(() => { if (!UPD.neuLaden) { UPD.neuLaden = true; location.reload(); } }, 5000);
}
AKT.updateJetzt = () => updateAnwenden();
// Von selbst installieren nur auf den Startseiten und wenn gerade nichts angetippt wird, sonst bleibt der Knopf stehen (nie mitten in der Runde neu laden).
setInterval(() => {
  if (!UPD.wartet || UPD.neuLaden) return;
  if ((V.name === 'start' || V.name === 'profile') && Date.now() - UPD.letzteEingabe > 2500 && !$('#layer').firstElementChild && !IMP.laeuft) updateAnwenden();
}, 2000);
const updRuhig = () => ['start', 'profile', 'karte', 'album', 'riff', 'bibliothek', 'ich'].indexOf(V.name) >= 0 && !$('#layer').firstElementChild;

// ---------- Netz ----------
async function updJson(url) {
  const r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(url + ': ' + r.status);
  return r.json();
}
function repoAdresse(idx, loc) {                                          // https://<name>.github.io/<repo>/  →  { owner, repo }  (oder in index.json eingetragen)
  if (idx && idx.repo && idx.repo.owner && idx.repo.repo) return idx.repo;
  loc = loc || location;
  const m = /^([a-z0-9-]+)\.github\.io$/i.exec(loc.hostname);
  if (!m) return null;
  const seg = loc.pathname.split('/').filter(Boolean);
  return { owner: m[1], repo: seg.length && !/\.html?$/i.test(seg[0]) ? seg[0] : m[1] + '.github.io' };
}
async function repoPaketListe() {                                       // → [{ datei, bytes, sha, name, lektionen:[{key,titel,karten}], raw? }]
  const map = new Map();
  let idx = null;
  try { idx = await updJson('karten/index.json'); (idx.pakete || []).forEach(p => map.set(p.datei, Object.assign({}, p))); } catch (e) { idx = null; }
  const gh = repoAdresse(idx);
  let apiOk = false;
  if (gh) {
    try {
      const r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/karten`, { headers: { Accept: 'application/vnd.github+json' } });
      if (r.ok) {
        apiOk = true;
        (await r.json()).filter(f => f.type === 'file' && /\.zip$/i.test(f.name)).forEach(f => {
          const alt = map.get(f.name);
          if (alt) { if (alt.sha !== f.sha) { alt.sha = f.sha; alt.bytes = f.size; } alt.raw = f.download_url; }       // Datei wurde nach dem Index-Bau ersetzt: GitHub hat recht
          else map.set(f.name, { datei: f.name, bytes: f.size, sha: f.sha, raw: f.download_url, name: f.name.replace(/\.zip$/i, '').replace(/_/g, ' '), lektionen: [] });
        });
      }
    } catch (e) { /* GitHub nicht erreichbar oder Grenze erreicht: der Index genügt */ }
  }
  if (!idx && !apiOk) throw new Error('keine Kartenliste');
  return Array.from(map.values()).sort((a, b) => a.datei.localeCompare(b.datei));
}
async function updBlob(url, fort) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(url + ': ' + r.status);
  const gesamt = +r.headers.get('content-length') || 0;
  if (!r.body || !r.body.getReader) return r.blob();
  const rd = r.body.getReader(), teile = []; let gelesen = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; teile.push(value); gelesen += value.length; if (fort) fort(gelesen, gesamt); }
  return new Blob(teile, { type: 'application/zip' });
}

// ---------- Was ist schon geladen? (nur auf diesem Gerät) ----------
async function repoStand() { try { return (await DB.get('kv', 'repo')) || { pakete: {} }; } catch (e) { return { pakete: {} }; } }
async function repoMerken(st) { try { await DB.set('kv', 'repo', st); } catch (e) { /* egal */ } }
async function kartenLuecken() {                                     // Lektionen, für die Bilder fehlen (z. B. nach dem Laden einer Sicherung auf einem neuen Gerät)
  const keys = new Set(await DB.keys('img')), out = [];
  Object.values(S.lib.lessons).forEach(L => {
    const cids = Object.keys(L.cards), fehlt = cids.filter(c => !keys.has(c + '_v') || !keys.has(c + '_h')).length;
    if (fehlt) out.push({ key: L.key, titel: L.titel, sp: L.sp, fehlt, gesamt: cids.length });
  });
  return out;
}
async function paketeBereitsDa(p, luecken) {                         // alle Lektionen des Pakets sind schon vollständig im Gerät
  const ks = (p.lektionen || []);
  if (!ks.length) return false;
  return ks.every(l => { const L = S.lib.lessons[l.key]; return L && Object.keys(L.cards).length >= (l.karten || 1) && !luecken.some(x => x.key === l.key); });
}

// ---------- Paket laden und einlesen ----------
async function paketLaden(p, fort) {
  const urls = ['karten/' + encodeURIComponent(p.datei)];
  if (p.raw) urls.push(p.raw);                                       // GitHub-Pages braucht nach dem Hochladen ein, zwei Minuten: bis dahin direkt von GitHub
  let blob = null, fehler = null;
  for (const u of urls) { try { blob = await updBlob(u, (g, n) => fort && fort('lade', g, n)); break; } catch (e) { fehler = e; } }
  if (!blob) throw fehler || new Error('Download fehlgeschlagen');
  IMP.laeuft = true; IMP.bericht = null; IMP.text = `Karten einlesen: ${p.name || p.datei}`; IMP.i = 0; IMP.n = 0;
  let b;
  try {
    b = await importiere([new File([blob], p.datei, { type: 'application/zip' })], (txt, i, n) => { IMP.text = txt; IMP.i = i; IMP.n = n; if (fort) fort('lese', i, n); });
  } finally { IMP.laeuft = false; }
  b.ordner = false; IMP.bericht = b;
  return b;
}
async function kartenSync(o) {
  o = o || {};
  const r = { geladen: [], offen: [], fehler: [], keineListe: false };
  let liste;
  try { liste = await repoPaketListe(); UPD.listeFehler = false; } catch (e) { UPD.listeFehler = true; r.keineListe = true; return r; }
  UPD.pakete = liste;
  const stand = await repoStand();
  const luecken = await kartenLuecken();
  const lokal = Object.keys(S.lib.lessons);
  const faellig = [];
  for (const p of liste) {
    const rec = stand.pakete[p.datei];
    if (!rec) {
      if (await paketeBereitsDa(p, luecken)) { stand.pakete[p.datei] = { sha: p.sha, bytes: p.bytes, am: Date.now(), vorhanden: true }; continue; }   // schon von Hand eingelesen
      faellig.push(p);
    } else if (rec.sha !== p.sha) {
      const ks = (p.lektionen || []).map(l => l.key);
      if (!ks.length || ks.some(k => lokal.indexOf(k) >= 0)) faellig.push(p);                  // geändert: nur nachziehen, wenn die Lektion noch da ist (bewusst Entferntes bleibt weg)
    }
  }
  await repoMerken(stand);
  r.offen = faellig;
  if (!faellig.length) return r;
  const bytes = sum(faellig.map(p => p.bytes || 0));
  if (!o.hand && !(appEinst().autoKarten)) return r;
  if (!o.hand && !appEinst().kartenOk && bytes > 15 * 1048576) { UPD.frage = { pakete: faellig, bytes }; updPilleStand(); return r; }   // große Mengen erst mit Ja
  return kartenLaden(faellig, r);
}
async function kartenLaden(faellig, r) {
  r = r || { geladen: [], offen: [], fehler: [] };
  const stand = await repoStand();
  let k = 0;
  for (const p of faellig) {
    k++;
    const kopf = `Karten ${k}/${faellig.length}: ${p.name || p.datei}`;
    try {
      const b = await paketLaden(p, (was, a, n) => updPille(was === 'lade' ? `${kopf} laden` : `${kopf} einlesen`, n ? a / n * 100 : null));
      if (b.fehler.length || b.neu + b.aktualisiert === 0) { r.fehler.push(`${p.datei}: ${b.fehler[0] || 'keine Karten gefunden'}`); continue; }
      stand.pakete[p.datei] = { sha: p.sha, bytes: p.bytes, am: Date.now() };
      await repoMerken(stand);
      r.geladen.push({ datei: p.datei, name: p.name || p.datei, karten: b.neu + b.aktualisiert });
    } catch (e) { r.fehler.push(`${p.datei}: ${(e && e.message) || e}`); }
  }
  updPille('');
  r.offen = [];
  if (r.geladen.length) { TON.spiel('fertig'); FX.blasen(innerWidth / 2, innerHeight / 2, 24); }
  if (V.name === 'bibliothek') render();
  return r;
}
AKT.kartenFrageJa = async () => { const f = UPD.frage; UPD.frage = null; appEinst().kartenOk = true; sichere(); updPilleStand(); if (f) { const r = await kartenLaden(f.pakete); updErgebnis({ geladen: r.geladen, fehler: r.fehler, hand: false }); } };
AKT.kartenFrageNein = () => { UPD.frage = null; updPilleStand(); };

// ---------- Prüfung: App + Karten ----------
function updWarte(sw, ms) {
  return new Promise(res => {
    if (!sw || sw.state === 'installed' || sw.state === 'activated') return res();
    const t = setTimeout(res, ms);
    sw.addEventListener('statechange', () => { if (['installed', 'activated', 'redundant'].indexOf(sw.state) >= 0) { clearTimeout(t); res(); } });
  });
}
function updErgebnis(e) {
  const t = [];
  if (e.app) t.push('Neue App-Version bereit.');
  if (e.geladen && e.geladen.length) t.push(`${e.geladen.length} ${e.geladen.length === 1 ? 'Kartenpaket' : 'Kartenpakete'} geladen (${sum(e.geladen.map(g => g.karten))} Karten).`);
  if (e.fehler && e.fehler.length) t.push('Problem: ' + e.fehler[0]);
  if (!t.length) t.push(e.offline ? 'Keine Verbindung. Ich versuche es später wieder.' : e.keineListe ? 'Keine Kartenliste gefunden. Die App ist aktuell.' : 'Alles aktuell.');
  UPD.ergebnis = Object.assign({ zeit: Date.now(), text: t.join(' ') }, e);
  if (e.hand || (e.geladen && e.geladen.length)) toast(UPD.ergebnis.text, e.fehler && e.fehler.length ? 'info' : 'haken', 4200);
  if (V.name === 'ich') ichUpdateStatus();
}
async function updatePruefen(o) {
  o = o || {};
  if (!UPD.web) { if (o.hand) toast('Updates gibt es nur in der Web-Version. Öffne Wortriff über den Link aus dem Repo und lege es auf den Home-Bildschirm.', 'info', 6000); return; }
  if (UPD.laeuft) return;
  UPD.laeuft = true; UPD.geprueft = Date.now();
  if (V.name === 'ich') ichUpdateStatus();
  const erg = { app: false, geladen: [], fehler: [], offline: false, keineListe: false, hand: !!o.hand };
  try {
    if (UPD.reg) {
      try { await UPD.reg.update(); } catch (e) { erg.offline = true; }
      await updWarte(UPD.reg.installing, 20000);
      if (UPD.reg.waiting && navigator.serviceWorker.controller) updNeuWartet(UPD.reg.waiting);
    } else if (navigator.onLine !== false) {
      try { const v = await updJson('version.json'); if (v.id && v.id !== APP_ID) { erg.app = true; if (o.hand) updPille('Neue Version gefunden.', null, [['Seite neu laden', 'updateJetzt']]); } } catch (e) { erg.offline = true; }
    }
    erg.app = erg.app || !!UPD.wartet;
    if (!erg.offline && (o.hand || appEinst().autoKarten)) {
      if (!o.hand && !updRuhig()) { UPD.spaeter = true; }                     // nicht während der Runde: später
      else { const r = await kartenSync({ hand: o.hand }); erg.geladen = r.geladen || []; erg.fehler = r.fehler || []; erg.keineListe = !!r.keineListe; }
    }
  } catch (e) { erg.fehler.push(String((e && e.message) || e)); }
  UPD.laeuft = false;
  updErgebnis(erg);
}
AKT.updateSuchen = () => updatePruefen({ hand: true });
function updAutoStart() {
  if (!UPD.web) return;
  const los = () => { if (appEinst().autoUpdate && navigator.onLine !== false && Date.now() - UPD.geprueft > 15 * 60 * 1000) updatePruefen({}); };
  setTimeout(los, 2500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(los, 800); });
  window.addEventListener('online', () => setTimeout(los, 1500));
  setInterval(() => { if (UPD.spaeter && updRuhig() && !UPD.laeuft) { UPD.spaeter = false; updatePruefen({}); } }, 15000);
  setInterval(los, 30 * 60 * 1000);
}

// ---------- Sicherung laden (Umzug von der alten Version / vom alten Gerät) ----------
document.addEventListener('change', async ev => {
  const f = ev.target;
  if (!f || f.id !== 'fSicherung') return;
  const file = f.files[0]; f.value = ''; if (!file) return;
  await sicherungPruefen(file);
});
async function sicherungPruefen(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { toast('Die Datei ist keine Wortriff-Sicherung.', 'info', 4500); return; }
  if (!j || j.app !== 'wortriff' || !j.zustand || j.zustand.v !== 1) { toast('Das ist keine Wortriff-Sicherung.', 'info', 4500); return; }
  const z = j.zustand, nutzer = Object.values(z.users || {}), lekt = Object.values((z.lib && z.lib.lessons) || {});
  const karten = sum(lekt.map(L => Object.keys(L.cards || {}).length));
  const antworten = sum(nutzer.map(u => (u.stats && u.stats.antworten) || 0));
  const jetztDa = Object.keys(S.users).length > 0;
  V.sicherungNeu = z;
  zeigeBlatt(`<h2>Sicherung übernehmen?</h2>
    <p class="mut" style="margin:6px 0 12px">Gespeichert am ${esc(j.am ? new Date(j.am).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : '?')}</p>
    <div class="panel dicht" style="margin-bottom:12px"><div class="zeile w">${nutzer.map(u => `<span class="chip">${esc(u.name)} · ${nf(u.xp || 0)} XP</span>`).join('') || '<span class="mut">keine Nutzer</span>'}</div>
      <p style="margin-top:10px"><b>${nutzer.length}</b> ${nutzer.length === 1 ? 'Nutzer' : 'Nutzer'} · <b>${nf(antworten)}</b> Antworten · <b>${lekt.length}</b> ${lekt.length === 1 ? 'Lektion' : 'Lektionen'} mit <b>${nf(karten)}</b> Karten</p></div>
    ${jetztDa ? '<div class="hinweisbox" style="margin-bottom:12px"><b>Achtung:</b> Der Stand auf diesem Gerät wird durch die Sicherung ersetzt. Eine Kopie davon bleibt für „Rückgängig“ erhalten.</div>' : ''}
    <p class="mut" style="font-size:14px;margin-bottom:14px">Die Sicherung enthält Lernstand, Belohnungen, Riff und Projekte. Die Kartenbilder holt die App danach selbst${UPD.web ? ' aus dem Repo' : ' (ZIP-Dateien unter „Karten“ hineinziehen)'}.</p>
    <div class="zeile"><button class="btn weiss" data-a="blattZu">Abbrechen</button><span class="sp1"></span><button class="btn gruen gross" data-a="sicherungJa">Übernehmen</button></div>`);
}
AKT.sicherungJa = async () => {
  const z = V.sicherungNeu; if (!z) return;
  if (Object.keys(S.users).length || Object.keys(S.lib.lessons).length) { try { await DB.set('kv', 'state_vorher', S); } catch (e) { /* egal */ } }
  S = z; S.lib = S.lib || { lessons: {} };
  await sichereJetzt();
  V.sicherungNeu = null; schliesseBlatt();
  const us = Object.keys(S.users);
  if (us.length === 1) { S.cur = us[0]; start(); } else { S.cur = null; gehe('profile'); }
  TON.spiel('fertig'); FX.konfetti(80);
  const luecken = await kartenLuecken();
  zeigeBlatt(`<h2>Sicherung übernommen</h2><p class="mut" style="margin:6px 0 12px">${us.length} ${us.length === 1 ? 'Nutzer' : 'Nutzer'}, ${Object.keys(S.lib.lessons).length} Lektionen.</p>
    ${luecken.length ? `<div class="hinweisbox blau" style="margin-bottom:12px"><b>Kartenbilder fehlen noch</b> bei ${luecken.map(l => esc(l.titel)).join(', ')} (${sum(luecken.map(l => l.fehlt))} Karten).<br>${UPD.web ? 'Die App holt sie jetzt aus dem Repo.' : 'Ziehe die ZIP-Dateien unter „Karten“ hinein.'}</div>` : '<div class="hinweisbox gruen" style="margin-bottom:12px">Alle Kartenbilder sind vorhanden.</div>'}
    <div class="zeile"><button class="btn weiss klein" data-a="sicherungZurueck">Rückgängig</button><span class="sp1"></span><button class="btn gruen" data-a="blattZu">Weiter</button></div>`);
  if (luecken.length && UPD.web) kartenNachladen();
};
AKT.sicherungZurueck = async () => {
  let v = null; try { v = await DB.get('kv', 'state_vorher'); } catch (e) { v = null; }
  if (!v) { toast('Es gibt nichts zum Zurücksetzen.', 'info'); return; }
  S = v; await sichereJetzt(); schliesseBlatt(); toast('Der vorherige Stand ist wieder da.', 'haken'); const us = Object.keys(S.users); if (us.length === 1) { S.cur = us[0]; start(); } else gehe('profile');
};

// ---------- Sicherung als Text (Zwischenablage): Notweg, wenn Dateien oder Downloads auf dem Gerät haken ----------
AKT.sicherungKopieren = async () => {
  const text = sicherungInhalt();
  try { if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('keine Zwischenablage'); await navigator.clipboard.writeText(text); S.sicherung = heute(); sichere(); toast('Sicherung kopiert. In der neuen App: Ich → Daten → „Aus Text laden“.', 'haken', 5000); if (V.name === 'ich') render(); return; } catch (e) { /* Rückfall: Text zum Markieren */ }
  zeigeBlatt(`<h2>Sicherung als Text</h2><p class="mut" style="margin:6px 0 10px;font-size:14px">Tippe in das Feld, wähle „Alles auswählen“ und „Kopieren“. In der neuen App: Ich → Daten → „Aus Text laden“.</p><textarea id="sicherungFeld" readonly rows="8" style="width:100%;font:12px monospace;user-select:text;-webkit-user-select:text">${esc(text)}</textarea><div class="zeile" style="margin-top:10px"><span class="sp1"></span><button class="btn blau" data-a="blattZu">Fertig</button></div>`);
  const fe = $('#sicherungFeld'); if (fe) { fe.focus(); fe.select(); }
};
AKT.sicherungText = () => {
  zeigeBlatt(`<h2>Sicherung aus Text laden</h2><p class="mut" style="margin:6px 0 10px;font-size:14px">Füge den kopierten Text ein (lange auf das Feld tippen → „Einfügen“).</p><textarea id="sicherungEinfuegen" rows="8" placeholder="Hier einfügen …" style="width:100%;font:12px monospace;user-select:text;-webkit-user-select:text"></textarea><div class="zeile" style="margin-top:10px"><button class="btn weiss" data-a="blattZu">Abbrechen</button><span class="sp1"></span><button class="btn blau" data-a="sicherungTextJa">Weiter</button></div>`);
};
AKT.sicherungTextJa = async () => {
  const fe = $('#sicherungEinfuegen'), text = fe ? fe.value.trim() : '';
  if (!text) { toast('Das Feld ist leer.', 'info'); return; }
  schliesseBlatt();
  await sicherungPruefen(new File([text], 'Sicherung.json', { type: 'application/json' }));
};

// ---------- fehlende Kartenbilder aus dem Repo holen ----------
async function kartenNachladen() {
  if (!UPD.web) { toast('Ziehe die ZIP-Dateien unter „Karten“ hinein.', 'info', 4500); return; }
  const luecken = await kartenLuecken();
  if (!luecken.length) { toast('Alle Kartenbilder sind vorhanden.', 'haken'); return; }
  updPille('Suche die Karten im Repo …', null);
  let liste;
  try { liste = await repoPaketListe(); UPD.pakete = liste; } catch (e) { updPille(''); toast('Keine Verbindung zum Repo.', 'info', 4000); return; }
  const keys = luecken.map(l => l.key);
  let wahl = liste.filter(p => (p.lektionen || []).some(l => keys.indexOf(l.key) >= 0));
  const ohneInfo = liste.filter(p => !(p.lektionen || []).length);
  wahl = wahl.concat(ohneInfo.filter(p => wahl.indexOf(p) < 0));
  const r = await kartenLaden(wahl);
  const rest = await kartenLuecken();
  updErgebnis({ geladen: r.geladen, fehler: r.fehler, hand: true });
  if (rest.length) zeigeBlatt(`<h2>Nicht alles gefunden</h2><p class="mut" style="margin:6px 0 12px">Im Repo gibt es keine Karten für: <b>${rest.map(l => esc(l.titel)).join(', ')}</b>.<br>Ziehe die ZIP-Dateien dieser Lektionen unter „Karten“ hinein.</p><div class="zeile"><span class="sp1"></span><button class="btn blau" data-a="nav" data-v="bibliothek">Zu „Karten“</button></div>`);
}
AKT.kartenNachladen = () => kartenNachladen();
AKT.kartenAlleLaden = async () => { const liste = UPD.pakete; if (!liste.length) { await updatePruefen({ hand: true }); return; } const st = await repoStand(); const r = await kartenLaden(liste.filter(p => !st.pakete[p.datei] || st.pakete[p.datei].sha !== p.sha || !S.lib.lessons[((p.lektionen || [])[0] || {}).key])); updErgebnis({ geladen: r.geladen, fehler: r.fehler, hand: true }); };
AKT.kartenEinzeln = async el => { const p = UPD.pakete.find(x => x.datei === el.dataset.v); if (!p) return; const r = await kartenLaden([p]); updErgebnis({ geladen: r.geladen, fehler: r.fehler, hand: true }); };

// ---------- Anzeige: Karten-Seite (Pakete im Repo) ----------
function repoPanelHtml() {
  if (!UPD.web) return '';
  return `<div class="sektion">Kartenpakete im Repo <small id="repoZahl"></small></div><div class="panel dicht" id="repoPanel"><p class="mut">Suche nach Kartenpaketen …</p></div>`;
}
async function repoPanelFuellen() {
  const el = $('#repoPanel'); if (!el) return;
  let liste = UPD.pakete;
  try { liste = await repoPaketListe(); UPD.pakete = liste; UPD.listeFehler = false; } catch (e) { UPD.listeFehler = true; }
  const el2 = $('#repoPanel'); if (!el2) return;
  if (!liste.length) { el2.innerHTML = `<p class="mut">${UPD.listeFehler ? 'Die Kartenliste ist gerade nicht erreichbar (keine Verbindung?).' : 'Im Repo liegen noch keine Kartenpakete.'}</p>`; return; }
  const st = await repoStand();
  const z = $('#repoZahl'); if (z) z.textContent = `${liste.length} ${liste.length === 1 ? 'Paket' : 'Pakete'}`;
  const zeile = p => {
    const rec = st.pakete[p.datei], da = rec && rec.sha === p.sha, neu = !rec, upd = rec && rec.sha !== p.sha;
    const chip = da ? '<span class="chip klein gruen">' + ico('haken') + ' geladen</span>' : neu ? '<span class="chip klein gold">neu</span>' : '<span class="chip klein gold">Update</span>';
    return `<div class="repozeile"><div class="t"><b>${esc(p.name || p.datei)}</b><small>${[(p.lektionen || []).map(l => esc(l.titel) + (l.karten ? ' · ' + l.karten + ' Karten' : '')).join(' · '), updMB(p.bytes || 0) + ' MB', esc(p.datei)].filter(Boolean).join(' · ')}</small></div>${chip}<button class="btn klein ${da ? 'weiss' : 'blau'}" data-a="kartenEinzeln" data-v="${esc(p.datei)}">${ico('speichern')} ${da ? 'Neu laden' : 'Laden'}</button></div>`;
  };
  el2.innerHTML = liste.map(zeile).join('') + `<div class="zeile" style="margin-top:10px"><button class="btn blau klein" data-a="kartenAlleLaden">${ico('speichern')} Alle neuen laden</button><button class="btn weiss klein" data-a="kartenNachladen">Fehlende Bilder nachladen</button></div>`;
}

// ---------- Anzeige: „Ich“ → App & Updates ----------
function appPanelHtml() {
  const e = appEinst(), modus = !UPD.web ? 'datei' : istApp() ? 'app' : 'browser';
  const modusText = modus === 'app' ? 'Als App auf dem Home-Bildschirm. Hier löscht iPadOS den Speicher nicht wegen langer Nichtbenutzung. Löschst du das Symbol, verschwindet aber auch der Lernstand: vorher sichern.' : modus === 'browser' ? 'Im Browser-Tab. Lege Wortriff auf den Home-Bildschirm, dann löscht iPadOS den Speicher nicht wegen langer Nichtbenutzung.' : 'Als lokale Datei. Updates und Karten aus dem Repo gibt es in der Web-Version.';
  const schalter = (k, t, s) => `<div class="einst"><div class="t"><b>${t}</b><span>${s}</span></div><button class="schalter ${e[k] !== false ? 'an' : ''}" data-a="appEinst" data-v="${k}" aria-label="${t}"></button></div>`;
  return `<div class="sektion">App und Updates</div><div class="panel" id="appPanel">
    <div class="zeile w"><span class="chip">Wortriff ${APP_VERSION}</span><span class="chip klein">Stand ${esc(APP_BUILD)}</span><span class="chip klein" title="Kennung dieser Fassung">${esc(APP_ID)}</span><span class="sp1"></span>
    <button class="btn blau klein" data-a="updateSuchen" ${UPD.web ? '' : 'disabled'}>${ico('laden')} Nach Updates suchen</button></div>
    <p class="mut" style="margin-top:8px;font-size:14px" id="updStatus">${esc(updStatusText())}</p>
    ${UPD.web ? schalter('autoUpdate', 'Automatisch nach Updates suchen', 'Beim Start und beim Zurückkehren in die App') + schalter('autoKarten', 'Neue Karten automatisch laden', 'Kartenpakete, die im Repo dazukommen') : ''}
    <p class="mut" style="font-size:14px;margin-top:8px" id="speicherStatus">${esc(modusText)}</p>
    <div class="zeile w" style="margin-top:8px"><button class="btn weiss klein" data-a="kartenNachladen">Kartenprüfung</button></div><p class="mut" style="font-size:14px;margin-top:6px" id="kartenStatus"></p></div>`;
}
function updStatusText() {
  if (!UPD.web) return 'Lokale Datei: kein Update nötig. Für Updates und neue Karten die Web-Version nutzen.';
  if (UPD.laeuft) return 'Suche nach Updates …';
  if (UPD.wartet) return 'Eine neue Version ist bereit. Tippe unten auf „Jetzt installieren“.';
  const e = UPD.ergebnis;
  return e ? `${e.text} (${new Date(e.zeit).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr)` : 'Noch nicht gesucht.';
}
function ichUpdateStatus() { const el = $('#updStatus'); if (el) el.textContent = updStatusText(); }
async function appPanelNach() {
  ichUpdateStatus();
  try {
    const p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    const el = $('#speicherStatus');
    if (el) el.textContent += ` Speicher ${p === true ? 'dauerhaft zugesichert' : p === false ? 'nicht dauerhaft zugesichert' : ''}${est && est.usage != null ? ', belegt: ' + Math.round(est.usage / 1048576) + ' MB' : ''}.`;
  } catch (e) { /* egal */ }
  try {
    const l = await kartenLuecken(), el = $('#kartenStatus');
    const alle = sum(Object.values(S.lib.lessons).map(L => Object.keys(L.cards).length));
    if (el) el.innerHTML = l.length ? `<b>${sum(l.map(x => x.fehlt))} von ${alle} Karten ohne Bild</b> (${l.map(x => esc(x.titel)).join(', ')}).` : (alle ? `Alle ${alle} Karten haben ihre Bilder.` : 'Noch keine Karten in der Bibliothek.');
  } catch (e) { /* egal */ }
}
AKT.appEinst = el => { const e = appEinst(), k = el.dataset.v; e[k] = e[k] === false; sichere(); render(); };

// ---------- Hinweis zum Home-Bildschirm (nur iPad/iPhone im Browser-Tab) ----------
function installHinweisHtml() {
  if (!UPD.web || istApp() || !istIOS()) return '';
  const e = appEinst();
  if (e.installBis && e.installBis > Date.now()) return '';
  const hat = Object.keys(S.users).length > 0;

    ${hat ? '<br><b>Wichtig:</b> Die Home-Bildschirm-App startet mit leerem Speicher. Sichere vorher deinen Fortschritt (Ich → Daten → „Fortschritt sichern“) und lade die Sicherung in der App vom Home-Bildschirm.' : ''}
    <div style="margin-top:8px"><button class="btn klein weiss" data-a="installSpaeter">Später erinnern</button></div></div>`;

AKT.installSpaeter = () => { appEinst().installBis = Date.now() + 3 * 86400000; sichere(); render(); };

// ---------- Umzug: Block für Profil- und Neu-Seite ----------
function umzugHtml() {
  return `<div class="panel dicht umzug"><h3>Schon mit Wortriff gelernt?</h3>
    <p class="mut" style="margin:6px 0 10px;font-size:14px">Hol deinen Fortschritt aus der alten Version: Dort unter <b>Ich → Daten → „Fortschritt sichern“</b> eine Sicherung speichern, hier laden. Die Karten holt sich die App danach selbst${UPD.web ? ' aus dem Repo' : ''}.</p>

'use strict';
// ---------- Start ----------
(async function init() {
  window.addEventListener('error', e => { try { console.error('Fehler:', e.message); } catch (x) { /* nichts */ } });
  await DB.open();
  await ladeZustand();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  const us = Object.keys(S.users);
  if (us.length === 1 && S.cur && S.users[S.cur]) start();
  else if (us.length === 0) gehe('neuNutzer', { name: '', avatar: pick(STARTER) });
  else gehe('profile');
  updAutoStart();
  window.__bereit = true;
})();
